<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>施工负责人取证刷题小程序</title>
<style>
:root{
  --primary:#1a73e8; --primary-dark:#1557b0; --bg:#f0f4f8; --card:#ffffff;
  --ok:#16a34a; --err:#dc2626; --text:#1f2937; --sub:#6b7280; --line:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;background:#f0f4f8;background:var(--bg,#f0f4f8);color:#1f2937;color:var(--text,#1f2937);padding-bottom:40px}
.header{background:#1a73e8;background:linear-gradient(135deg,#1a73e8,#0d47a1);background:var(--primary,#1a73e8),#0d47a1;color:#fff;padding:18px 16px 14px;text-align:center}
.header h1{font-size:20px;letter-spacing:1px}
.header .sub{font-size:12px;opacity:.9;margin-top:4px}
.wrap{max-width:760px;margin:14px auto;padding:0 12px}
.card{background:#ffffff;background:var(--card,#ffffff);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px;margin-bottom:14px}
/* 兼容方案：Safari 14.1 以下不支持 flex gap，改用 margin 间隔 */
.row{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px}
.row>*{margin:4px}
select,.btn{padding:8px 14px;border-radius:8px;border:1px solid #e5e7eb;border:1px solid var(--line,#e5e7eb);font-size:14px;background:#fff;cursor:pointer}
.btn{background:#1a73e8;background:var(--primary,#1a73e8);color:#fff;border:none;font-weight:600;transition:.15s}
.btn:hover{background:#1557b0;background:var(--primary-dark,#1557b0)}
.btn.ghost{background:#fff;color:#1a73e8;color:var(--primary,#1a73e8);border:1px solid #1a73e8;border:1px solid var(--primary,#1a73e8)}
.btn.danger{background:#fff;color:#dc2626;color:var(--err,#dc2626);border:1px solid #dc2626;border:1px solid var(--err,#dc2626)}
.btn.small{padding:5px 10px;font-size:12px}
.stats{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px}
.stats>*{margin:4px}
.stat{-webkit-flex:1 1 90px;flex:1 1 90px;min-width:90px;background:#f8fafc;border:1px solid #e5e7eb;border:1px solid var(--line,#e5e7eb);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px;color:#1a73e8;color:var(--primary,#1a73e8)}
.stat span{font-size:12px;color:#6b7280;color:var(--sub,#6b7280)}
.section-title{font-size:15px;font-weight:700;margin-bottom:10px;display:-webkit-flex;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:#1a73e8;color:var(--primary,#1a73e8);margin-left:6px}
#quizArea .q-meta{font-size:12px;color:#6b7280;color:var(--sub,#6b7280);margin-bottom:8px;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px}
#quizArea .q-meta>*{margin:4px}
.tag{background:#f1f5f9;border-radius:6px;padding:2px 8px}
.q-text{font-size:16px;line-height:1.7;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.opt{display:-webkit-flex;display:flex;-webkit-box-align:start;-webkit-align-items:flex-start;align-items:flex-start;gap:10px;padding:11px 12px;border:1.5px solid #e5e7eb;border:1.5px solid var(--line,#e5e7eb);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.12s;background:#fff}
.opt:hover{border-color:#1a73e8;border-color:var(--primary,#1a73e8)}
.opt .key{-webkit-flex:0 0 26px;flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:#f1f5f9;color:#6b7280;color:var(--sub,#6b7280);font-weight:700;font-size:13px}
.opt .txt{-webkit-flex:1;flex:1;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.opt.sel{border-color:#1a73e8;border-color:var(--primary,#1a73e8);background:#eff6ff}
.opt.sel .key{background:#1a73e8;background:var(--primary,#1a73e8);color:#fff}
.opt.right{border-color:#16a34a;border-color:var(--ok,#16a34a);background:#f0fdf4}
.opt.right .key{background:#16a34a;background:var(--ok,#16a34a);color:#fff}
.opt.wrong{border-color:#dc2626;border-color:var(--err,#dc2626);background:#fef2f2}
.opt.wrong .key{background:#dc2626;background:var(--err,#dc2626);color:#fff}
.opt.dim{opacity:.55}
.result-box{border-radius:10px;padding:12px;margin-top:10px;font-size:14px;line-height:1.7;display:none}
.result-box.show{display:block}
.result-box.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.result-box.bad{background:#fef2f2;border:1px solid #fecaca}
.result-box .analysis{margin-top:6px;color:#6b7280;color:var(--sub,#6b7280);font-size:13px}
.nav{display:-webkit-flex;display:flex;-webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;margin:-4px;margin-top:12px}
.nav>*{margin:4px}
.nav .btn{-webkit-flex:1;flex:1}
/* 答题卡：grid-gap 兼容老 Safari（10.1-11），gap 用于新 Safari */
.answer-sheet{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-3px;margin-top:10px}
.answer-sheet>*{margin:3px}
@supports (display:grid){
  .answer-sheet{display:-ms-grid;display:grid;-ms-grid-columns:repeat(auto-fill,minmax(38px,1fr));grid-template-columns:repeat(auto-fill,minmax(38px,1fr));margin:0;margin-top:10px}
  .answer-sheet>*{margin:0}
  .answer-sheet{-ms-grid-gap:6px;grid-gap:6px;gap:6px}
}
.as-item{height:36px;line-height:36px;text-align:center;border-radius:8px;background:#f1f5f9;font-size:13px;cursor:pointer;border:1px solid transparent;-webkit-flex:0 0 38px;flex:0 0 38px;width:38px}
.as-item.cur{border-color:#1a73e8;border-color:var(--primary,#1a73e8);background:#eff6ff;color:#1a73e8;color:var(--primary,#1a73e8);font-weight:700}
.as-item.done{background:#dbeafe}
.as-item.wrong{background:#fee2e2;color:#dc2626;color:var(--err,#dc2626)}
.as-item.right{background:#dcfce7;color:#16a34a;color:var(--ok,#16a34a)}
.quiz-list-item{border:1px solid #e5e7eb;border:1px solid var(--line,#e5e7eb);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.quiz-list-item:hover{border-color:#1a73e8;border-color:var(--primary,#1a73e8)}
.quiz-list-item .q{font-size:14px;line-height:1.6;margin-bottom:4px;word-break:break-word}
.quiz-list-item .meta{font-size:12px;color:#6b7280;color:var(--sub,#6b7280)}
.empty{text-align:center;color:#6b7280;color:var(--sub,#6b7280);padding:30px 0;font-size:14px}
.toolbar{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-4px;margin-bottom:8px}
.toolbar>*{margin:4px}
.toolbar select{-webkit-flex:1;flex:1;min-width:120px}
.diff-legend{font-size:12px;color:#6b7280;color:var(--sub,#6b7280);margin-top:6px}
.diff-legend span{margin-right:12px}
#examResult{display:none}
#examResult.show{display:block}
.storage-note{display:none;background:#fef9c3;border:1px solid #fde047;border-radius:8px;padding:8px 10px;font-size:12px;color:#854d0e;margin-bottom:10px;line-height:1.6}
.storage-note.show{display:block}
.modal-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;padding:16px}
.modal-mask.show{display:-webkit-flex;display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%;text-align:center}
.modal h3{margin-bottom:12px}
.modal .score{font-size:44px;font-weight:800;color:#1a73e8;color:var(--primary,#1a73e8);margin:8px 0}
.modal .score-sub{color:#6b7280;color:var(--sub,#6b7280);font-size:13px;margin-bottom:14px}
.footer{text-align:center;color:#6b7280;color:var(--sub,#6b7280);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="header">
  <h1>施工负责人取证刷题</h1>
  <div class="sub">共 <b id="totalCount">0</b> 题 · 单选 / 多选 / 判断 · 已跳过填空题</div>
</div>

<div class="wrap">
  <div class="storage-note" id="storageNote"></div>

  <!-- 统计 -->
  <div class="card">
    <div class="section-title">学习进度</div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>题目总数</span></div>
      <div class="stat"><b id="sDone">0</b><span>已练习</span></div>
      <div class="stat"><b id="sRight">0</b><span>答对</span></div>
      <div class="stat"><b id="sWrong">0</b><span>答错</span></div>
      <div class="stat"><b id="sRate">0%</b><span>正确率</span></div>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="card">
    <div class="section-title">筛选题目</div>
    <div class="toolbar">
      <select id="fType">
        <option value="all">全部题型</option>
        <option value="single">单选题</option>
        <option value="multiple">多选题</option>
        <option value="judge">判断题</option>
      </select>
      <select id="fPoint"><option value="all">全部考核点</option></select>
      <select id="fDiff">
        <option value="all">全部难度</option>
        <option value="易">易</option>
        <option value="中">中</option>
        <option value="难">难</option>
      </select>
    </div>
    <div class="row" style="justify-content:space-between;-webkit-box-pack:justify;-webkit-justify-content:space-between">
      <div style="font-size:13px;color:#6b7280;color:var(--sub,#6b7280)">当前筛选：<b id="filterCount">0</b> 题</div>
      <div class="row">
        <button class="btn small" onclick="startPractice(false)">顺序练习</button>
        <button class="btn small" onclick="startPractice(true)">随机练习</button>
        <button class="btn small ghost" onclick="openExam()">模拟考试</button>
        <button class="btn small ghost" onclick="showWrong()">错题回顾</button>
      </div>
    </div>
  </div>

  <!-- 答题区 -->
  <div class="card" id="quizCard" style="display:none">
    <div class="section-title">
      <span id="quizMode">练习模式</span>
      <span class="badge" id="quizPos">0 / 0</span>
    </div>
    <div id="quizArea"></div>
    <div class="answer-sheet" id="answerSheet"></div>
    <div class="nav">
      <button class="btn ghost" id="btnPrev" onclick="prevQ()">上一题</button>
      <button class="btn" id="btnSubmit" onclick="submitQ()">提交答案</button>
      <button class="btn ghost" id="btnNext" onclick="nextQ()">下一题</button>
    </div>
    <div style="margin-top:10px;text-align:center">
      <button class="btn small ghost" id="btnFinish" onclick="finishSession()">结束本次练习</button>
    </div>
  </div>

  <!-- 列表区（错题回顾/考试结果明细） -->
  <div class="card" id="listCard" style="display:none">
    <div class="section-title"><span id="listTitle">列表</span><span><button class="btn small ghost" onclick="hideList()">返回</button></span></div>
    <div id="listArea"></div>
  </div>

  <div class="card" id="welcomeCard">
    <div class="section-title">开始刷题</div>
    <div id="welcomeArea"></div>
  </div>

  <div class="footer">数据来源：施工负责人取证题库-下发版2026.2.6（已排除填空题） · 本地运行，无网络请求 · 兼容 Safari</div>
</div>

<!-- 考试设置弹窗 -->
<div class="modal-mask" id="examModal">
  <div class="modal">
    <h3>模拟考试</h3>
    <div style="display:-webkit-flex;display:flex;gap:10px;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin-bottom:6px">
      <select id="examCount" style="padding:8px;border-radius:8px;border:1px solid #e5e7eb;border:1px solid var(--line,#e5e7eb)">
        <option value="10">10 题</option>
        <option value="20" selected>20 题</option>
        <option value="30">30 题</option>
        <option value="0">全部（当前筛选）</option>
      </select>
    </div>
    <div style="font-size:12px;color:#6b7280;color:var(--sub,#6b7280);margin-bottom:14px">从当前筛选结果中随机抽题，交卷后统一评分</div>
    <div class="row" style="-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center">
      <button class="btn" onclick="startExam()">开始考试</button>
      <button class="btn ghost" onclick="closeExamModal()">取消</button>
    </div>
  </div>
</div>

<!-- 成绩弹窗 -->
<div class="modal-mask" id="scoreModal">
  <div class="modal">
    <h3 id="scoreTitle">成绩</h3>
    <div class="score" id="scoreNum">0</div>
    <div class="score-sub" id="scoreSub"></div>
    <div class="row" style="-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center">
      <button class="btn" onclick="closeScore()">查看明细</button>
      <button class="btn ghost" onclick="retryExam()">再考一次</button>
    </div>
  </div>
</div>

var FILTERS = {type:'all', point:'all', diff:'all'};
var SESSION = {mode:null, items:[], cur:0, answers:{}, submitted:{}, source:null};
var WRONG_LIST = [];
var STORE_KEY = 'sgfz_quiz_progress_v1';

// ---------- 兼容 Safari 的本地存储封装 ----------
// Safari 直接打开本地 HTML（file:// 协议）时，localStorage 可能被禁用或抛出
// SecurityError / QuotaExceededError。统一封装：优先 localStorage，失败降级为内存存储。
var memStore = {};
var storageOK = (function(){
  try {
    localStorage.setItem('__sgfz_test__', '1');
    localStorage.removeItem('__sgfz_test__');
    return true;
  } catch (e) {
    return false;
  }
})();
function storageGet(k){
  try {
    var v = localStorage.getItem(k);
    if (v === null) return null;
    return JSON.parse(v);
  } catch (e) {
    return (k in memStore) ? memStore[k] : null;
  }
}
function storageSet(k, v){
  memStore[k] = v;
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {
    // 忽略：Safari file:// 下写入失败时使用内存存储
  }
}
function loadProgress(){
  var p = storageGet(STORE_KEY);
  return (p && typeof p === 'object') ? p : {done:{}, wrong:{}};
}
function saveProgress(p){ storageSet(STORE_KEY, p); }

// ---------- 筛选 ----------
function getFiltered(){
  var f=FILTERS;
  return ALL.filter(function(q){
    if(f.type!=='all' && q.type!==f.type) return false;
    if(f.point!=='all' && q.point!==f.point) return false;
    if(f.diff!=='all' && q.difficulty!==f.diff) return false;
    return true;
  });
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function typeName(t){return t==='single'?'单选题':(t==='multiple'?'多选题':'判断题');}
function diffName(d){return d==='易'?'易':(d==='中'?'中':'难');}

// ---------- 渲染统计 ----------
function renderStats(){
  var p=loadProgress();
  var done=Object.keys(p.done).length;
  var right=0, wrong=0;
  for(var k in p.done){ if(p.done[k]) right++; else wrong++; }
  document.getElementById('sTotal').textContent=ALL.length;
  document.getElementById('sDone').textContent=done;
  document.getElementById('sRight').textContent=right;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRate').textContent = (done? Math.round(right/done*100):0)+'%';
}
function renderWelcome(){
  var el=document.getElementById('welcomeArea');
  var filtered=getFiltered();
  var html='<div style="font-size:13px;color:#6b7280;color:var(--sub,#6b7280);line-height:1.8">';
  html+='<p>· 当前筛选条件下共有 <b>'+filtered.length+'</b> 道题</p>';
  html+='<p>· 点击上方"顺序练习"按顺序刷题，"随机练习"打乱顺序，多选/判断同样支持</p>';
  html+='<p>· "模拟考试"从当前筛选中随机抽题并统一评分；答错题目自动进入错题回顾</p>';
  html+='<p>· 进度自动保存在本机浏览器（localStorage）</p></div>';
  el.innerHTML=html;
}
function renderPointFilter(){
  var pts={};
  ALL.forEach(function(q){ if(q.point) pts[q.point]=1; });
  var keys=Object.keys(pts).sort();
  var sel=document.getElementById('fPoint');
  var cur=FILTERS.point;
  sel.innerHTML='<option value="all">全部考核点</option>'+keys.map(function(k){return '<option value="'+k.replace(/"/g,'&quot;')+'">'+k+'</option>';}).join('');
  sel.value=cur;
}
function onFilterChange(){
  FILTERS.type=document.getElementById('fType').value;
  FILTERS.point=document.getElementById('fPoint').value;
  FILTERS.diff=document.getElementById('fDiff').value;
  document.getElementById('filterCount').textContent=getFiltered().length;

function startPractice(randomOrder){

  var p=loadProgress();

    html+='<div class="quiz-list-item" onclick="practiceWrong('+i+')">';

function practiceWrong(idx){

// ---------- 渲染题目 ----------
function renderQ(){
  var s=SESSION;
  if(!s.items.length) return;
  var q=s.items[s.cur];
  var area=document.getElementById('quizArea');
  var submitted=!!s.submitted[s.cur];
  var html='';
  html+='<div class="q-meta">';
  html+='<span class="tag">'+typeName(q.type)+'</span>';
  html+='<span class="tag">'+esc(q.point||'未分类')+'</span>';
  html+='<span class="tag">难度：'+diffName(q.difficulty)+'</span>';
  if(s.mode==='exam' && !submitted) html+='<span class="tag" style="background:#fef9c3">考试中，交卷后评分</span>';
  html+='</div>';
  html+='<div class="q-text">'+esc(q.question)+'</div>';
  var sel=s.answers[s.cur]||[];
  var correct = submitted ? normalizeAns(q.answer) : null;
  q.options.forEach(function(op,i){
    var key=String.fromCharCode(65+i);
    var cls='opt';
    var isSel=sel.indexOf(key)>=0;
    if(submitted){
      var isRight=correct.indexOf(key)>=0;
      if(isSel && isRight) cls+=' right';
      else if(isSel && !isRight) cls+=' wrong';
      else if(!isSel && isRight) cls+=' right dim';
      else cls+=' dim';
    } else if(isSel) cls+=' sel';
    html+='<div class="'+cls+'" onclick="toggleOpt('+i+')">';
    html+='<div class="key">'+key+'</div><div class="txt">'+esc(op)+'</div></div>';
  });
  if(submitted){
    var ok=isCurRight();
    html+='<div class="result-box '+(ok?'ok':'bad')+' show">';
    html+=(ok?'<b>回答正确！</b>':'<b>回答错误</b>');
    html+='<div>正确答案：<b>'+esc(q.answer)+'</b>'+(q.options.length?'（'+correct.map(function(k){return String.fromCharCode(k.charCodeAt(0));}).join('、')+'）':'')+'</div>';
    if(q.analysis) html+='<div class="analysis">解析：'+esc(q.analysis)+'</div>';
    html+='</div>';
  } else {
    html+='<div class="result-box" id="pendingTip"></div>';
  }
  area.innerHTML=html;
  // 答题卡
  var as='';
  s.items.forEach(function(qq,i){
    var cls='as-item';
    if(i===s.cur) cls+=' cur';
    if(s.submitted[i]){
      var p=loadProgress();
      if(s.mode==='practice') cls+=' '+(p.done[qq.id]?'right':'wrong');
      else cls+=' '+(isAnsRight(qq, s.answers[i]||[])?'right':'wrong');
    }
    as+='<div class="'+cls+'" onclick="jumpQ('+i+')">'+(i+1)+'</div>';
  });
  document.getElementById('answerSheet').innerHTML=as;
  document.getElementById('quizPos').textContent=(s.cur+1)+' / '+s.items.length;
  document.getElementById('btnPrev').disabled=(s.cur===0);
  document.getElementById('btnNext').disabled=(s.cur===s.items.length-1);
}

function toggleOpt(i){
  var s=SESSION;
  if(s.submitted[s.cur]) return;
  var q=s.items[s.cur];
  var key=String.fromCharCode(65+i);
  var sel=s.answers[s.cur]||[];
  if(q.type==='multiple'){
    var idx=sel.indexOf(key);
    if(idx>=0) sel.splice(idx,1); else sel.push(key);
  } else {
    sel=[key];
  }
  s.answers[s.cur]=sel;
  renderQ();
}
function submitQ(){
  var s=SESSION;
  if(s.submitted[s.cur]){ nextQ(); return; }
  var q=s.items[s.cur];
  var sel=s.answers[s.cur]||[];
  if(!sel.length){ document.getElementById('pendingTip').innerHTML='<div class="result-box bad show"><b>请先选择答案</b></div>'; return; }
  if(s.mode==='exam'){ return; } // 考试模式交卷时才判定
  s.submitted[s.cur]=true;
  var ok=isAnsRight(q, sel);
  var p=loadProgress();
  p.done[q.id]=ok;
  if(!ok){ p.wrong[q.id]=true; } else { delete p.wrong[q.id]; }
  saveProgress(p);
  renderQ();
  renderStats();
}
function isCurRight(){ var s=SESSION; var q=s.items[s.cur]; return isAnsRight(q, s.answers[s.cur]||[]); }
function isAnsRight(q, sel){
  var correct=normalizeAns(q.answer);
  if(correct.length!==sel.length) return false;
  for(var i=0;i<correct.length;i++){ if(sel.indexOf(correct[i])<0) return false; }
  return true;
}
function normalizeAns(a){
  if(!a) return [];
  if(a==='正确') return ['A'];
  if(a==='错误') return ['B'];
  return a.toUpperCase().split('').filter(function(c){return c>='A'&&c<='Z';});
}
function nextQ(){ var s=SESSION; if(s.cur<s.items.length-1){ s.cur++; renderQ(); } }
function prevQ(){ var s=SESSION; if(s.cur>0){ s.cur--; renderQ(); } }
function jumpQ(i){ SESSION.cur=i; renderQ(); }
function finishSession(){
  var s=SESSION;
  if(s.mode==='exam'){ submitExam(); return; }
  var unanswered=s.items.filter(function(q,i){ return !s.submitted[i]; });
  if(unanswered.length){
    if(!confirm('还有 '+unanswered.length+' 题未提交答案，确定结束本次练习？')) return;
  }
  document.getElementById('quizCard').style.display='none';
  document.getElementById('welcomeCard').style.display='block';
  renderWelcome();
  renderStats();
}
// ---------- 考试 ----------
function submitExam(){
  var s=SESSION;
  if(!s.mode) return;
  var unanswered=s.items.filter(function(q,i){ return !s.answers[i]||!s.answers[i].length; });
  if(unanswered.length && !confirm('还有 '+unanswered.length+' 题未作答，确定交卷？')) return;
  var right=0, wrong=0;
  s.items.forEach(function(q,i){
    var sel=s.answers[i]||[];
    var ok=isAnsRight(q,sel);
    s.submitted[i]=true;
    if(ok) right++; else wrong++;
    var p=loadProgress();
    if(ok){ p.done[q.id]=true; delete p.wrong[q.id]; }
    else { p.done[q.id]=false; p.wrong[q.id]=true; }
    saveProgress(p);
  });
  renderStats();
  var score=Math.round(right/s.items.length*100);
  document.getElementById('scoreNum').textContent=score+'分';
  document.getElementById('scoreSub').textContent='答对 '+right+' / '+s.items.length+' 题';
  document.getElementById('scoreTitle').textContent='模拟考试结果';
  document.getElementById('scoreModal').classList.add('show');
  renderQ();
}
function closeScore(){
  document.getElementById('scoreModal').classList.remove('show');
  document.getElementById('quizCard').style.display='none';
  document.getElementById('welcomeCard').style.display='block';
  renderWelcome(); renderStats();
}
function retryExam(){
  document.getElementById('scoreModal').classList.remove('show');
  startExam();
}
// ---------- 工具 ----------
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- 初始化 ----------
(function init(){
  ALL.forEach(function(q,i){ q.id='q'+i; });
  document.getElementById('totalCount').textContent=ALL.length;
  renderPointFilter();
  renderStats();
  renderWelcome();
  document.getElementById('filterCount').textContent=ALL.length;
  document.getElementById('fType').onchange=onFilterChange;
  document.getElementById('fPoint').onchange=onFilterChange;
  document.getElementById('fDiff').onchange=onFilterChange;
  // Safari 本地存储降级提示
  if(!storageOK){
    var note=document.getElementById('storageNote');
    note.innerHTML='提示：当前 Safari 环境未启用本地存储（直接打开本地文件时可能被限制），学习进度将仅在本次会话内保留。如需长期保存，请前往 系统设置 → Safari → 隐私与安全性，允许网站数据；或将本文件加入书签后从书签打开。';
    note.className='storage-note show';
  }
})();
</script>
